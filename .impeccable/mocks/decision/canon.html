<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Roboto,sans-serif;background:#F3F5F9;color:#1F2937}
.top{background:#0B4DA2;color:#fff;padding:52px 20px 56px;border-radius:0 0 24px 24px}
.row{display:flex;align-items:center;gap:12px}.av{width:46px;height:46px;border-radius:50%;background:#fff}
.n{font-size:20px;font-weight:700}.s{font-size:14px;opacity:.85}
.sc{margin:-36px 16px 0;background:#fff;border-radius:18px;padding:16px 8px;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ci{width:48px;height:48px;border-radius:50%;background:#E3ECFA;margin:0 auto 8px}
h2{margin:22px 20px 10px;font-size:17px}
.card{margin:0 16px 12px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.ct{font-weight:700;font-size:16px}.cx{font-size:14px;color:#6B7280;margin-top:4px}.bd{display:inline-block;background:#FDE2E3;color:#D7262E;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:8px}
.nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);padding-top:12px;text-align:center;font-size:12px;color:#6B7280}
.nav .on{color:#0B4DA2}.i{width:24px;height:24px;border-radius:50%;background:currentColor;opacity:.4;margin:0 auto 6px}
</style></head><body>
<div class="top"><div class="row"><div class="av"></div><div><div class="n">Pedro Santos</div><div class="s">Mecânica · MEC-2B</div></div></div></div>
<div class="sc"><div><div class="ci"></div>Avisos</div><div><div class="ci"></div>Atestados</div><div><div class="ci"></div>Autorizar</div><div><div class="ci"></div>Suporte</div></div>
<h2>Últimas novidades</h2>
<div class="card"><div class="bd">Pendente</div><div class="ct">Saída antecipada sexta</div><div class="cx">Autorize a saída de Pedro às 10:00.</div></div>
<div class="card"><div class="ct">Feriado de 15/11</div><div class="cx">Não haverá aula.</div></div>
<div class="nav"><div class="on"><div class="i"></div>Início</div><div><div class="i"></div>Avisos</div><div><div class="i"></div>Aluno</div><div><div class="i"></div>Perfil</div></div>
</body></html>
